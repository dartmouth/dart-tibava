server {
    listen       80;
    server_name  localhost;
    root         /app/frontend/dist/;

    client_max_body_size 50G;

    # Backend API proxy. In the k8s deployment frontend and backend run as
    # containers in the same Pod (sharing a network namespace), so the
    # backend is reachable at localhost:8000. The trailing slashes on both
    # the location and proxy_pass strip the /backend/ prefix before
    # forwarding, since the Django app is mounted at "/", not "/backend/".
    location /backend/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        proxy_pass http://localhost:8000/;
    }

    location /thumbnails/ {
        alias /thumbnails/;
    }
    
    location /media/ {
        alias /media/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
